name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AutoMancer.slnx

      - name: Build
        run: dotnet build AutoMancer.slnx --no-restore --configuration Release

      - name: Test Engine
        run: dotnet test tests/AutoMancer.Engine.Tests/ --no-build --configuration Release --filter "Category!=Integration"

      - name: Test Cli
        run: dotnet test tests/AutoMancer.Cli.Tests/ --no-build --configuration Release
